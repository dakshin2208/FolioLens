# Local development and single-server deployment.
#   cp .env.example .env      (then edit secrets)
#   docker compose up --build
#   docker compose run --rm api python -m app.market_data.cli seed-demo
# Open http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foliolens
      POSTGRES_USER: foliolens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foliolens-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foliolens -d foliolens"]
      interval: 5s
      retries: 10
    # Not published to the host: only the api and worker containers can reach it.

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://foliolens:${POSTGRES_PASSWORD:-foliolens-local}@db:5432/foliolens}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "true"
      LOCAL_STORAGE_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 6

  worker:
    build: ./backend
    command: ["rq", "worker", "foliolens", "--url", "redis://redis:6379/0", "--with-scheduler"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://foliolens:${POSTGRES_PASSWORD:-foliolens-local}@db:5432/foliolens}
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      api: { condition: service_healthy }

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
